apiVersion: apps/v1
kind: Deployment
metadata:
  name: set15-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: set15-app
  template:
    metadata:
      labels:
        app: set15-app
    spec:
      containers:
        - name: set15-app
          image: set15-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: set15-service
spec:
  type: NodePort
  selector:
    app: set15-app
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30015
